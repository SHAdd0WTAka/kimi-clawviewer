repos:
  - repo: local
    hooks:
      - id: fmt
        name: Rust fmt
        entry: bash -c 'cd project && cargo fmt -- --check'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: Rust clippy
        entry: bash -c 'cd project && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: test
        name: Rust test
        entry: bash -c 'cd project && cargo test --all-features'
        language: system
        files: \.rs$
        pass_filenames: false
