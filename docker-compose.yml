version: '3.8'

services:
  clawviewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawviewer-enterprise
    restart: unless-stopped
    ports:
      - "9090:9090"
      - "8080:8080"
    volumes:
      - clawviewer-data:/var/lib/clawviewer
      - clawviewer-logs:/var/log/clawviewer
      - ./config:/etc/clawviewer:ro
    environment:
      - CLAWVIEWER_ENV=production
      - CLAWVIEWER_LOG_LEVEL=info
      - CLAWVIEWER_METRICS_ENABLED=true
    networks:
      - clawviewer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: clawviewer-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - clawviewer-network

  grafana:
    image: grafana/grafana:latest
    container_name: clawviewer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - clawviewer-network

volumes:
  clawviewer-data:
  clawviewer-logs:
  prometheus-data:
  grafana-data:

networks:
  clawviewer-network:
    driver: bridge
