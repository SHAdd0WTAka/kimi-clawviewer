name: ClawViewer Enterprise CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check Formatting
        working-directory: ./project
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        working-directory: ./project
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Run Tests
        working-directory: ./project
        run: cargo test --all --all-features --verbose
      
      - name: Generate Coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./project
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml --all --all-features
      
      - name: Upload Coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./project/cobertura.xml

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run Security Audit
        working-directory: ./project
        run: cargo audit
      
      - name: Run cargo-deny
        working-directory: ./project
        run: |
          cargo install cargo-deny
          cargo deny check

  build:
    name: Build Release
    needs: [lint, test, security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/package.json
      
      - name: Install Frontend Dependencies
        working-directory: ./project
        run: npm ci
      
      - name: Build Frontend
        working-directory: ./project
        run: npm run build
      
      - name: Build Rust (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./project
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo tauri build --target ${{ matrix.target }}
      
      - name: Build Rust (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./project
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo tauri build --target ${{ matrix.target }}
      
      - name: Build Rust (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./project
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo tauri build --target ${{ matrix.target }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clawviewer-${{ matrix.target }}
          path: |
            project/src-tauri/target/${{ matrix.target }}/release/bundle/
            project/target/${{ matrix.target }}/release/clawviewer

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: clawviewer-*
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
