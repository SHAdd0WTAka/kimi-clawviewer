[workspace]
resolver = "2"
members = [
    "crates/*",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ClawViewer Team <team@clawviewer.dev>"]
license = "MIT"
repository = "https://github.com/SHAdd0WTAka/kimi-clawviewer"

[workspace.dependencies]
# Core
tokio = { version = "1.36", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Config & Environment
config = "0.14"
dotenvy = "0.15"
once_cell = "1.19"

# Security
argon2 = "0.5"
ring = "0.17"
jsonwebtoken = "9.2"

# Async Runtime
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

# Logging & Metrics
opentelemetry = "0.22"
prometheus = "0.13"

# Serialization / Protocol
prost = "0.13"
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
zeroize = "1.7"

# Crypto
ed25519-dalek = "2.1"
x25519-dalek = "2.0"

# Networking
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Error Handling & Resilience
tower = { version = "0.4", features = ["retry", "timeout", "limit"] }
backoff = { version = "0.4", features = ["tokio"] }

# Internal Crates
clawviewer_lib = { path = "crates/clawviewer-lib" }
clawviewer_security = { path = "crates/clawviewer-security" }
clawviewer_network = { path = "crates/clawviewer-network" }
clawviewer_capture = { path = "crates/clawviewer-capture" }
clawviewer_webrtc = { path = "crates/clawviewer-webrtc" }
clawviewer_ui = { path = "crates/clawviewer-ui" }
clawviewer_monitoring = { path = "crates/clawviewer-monitoring" }
clawviewer_config = { path = "crates/clawviewer-config" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
